# Todos os ajustes do pipeline ficam aqui. Os valores sao os mesmos que estavam
# escritos dentro do codigo original, para o resultado continuar igual.
# Para mudar algo sem editar este arquivo, passe --configfile ao Snakemake.

compute:
  threads: 48          # quantos processadores os programas podem usar
  query_splits: 50     # em quantos pedacos dividir a busca, para rodar em paralelo

params:
  evalue: "0.01"           # o quanto uma semelhanca precisa ser boa para valer
                           # (quanto menor, mais exigente)
  min_read_length: 50      # leitura menor que isso e descartada
  contig_length_pre_cap3: 300    # tamanho minimo para entrar na montagem final
  contig_length_post_cap3: 1500  # tamanho minimo para sair da montagem e ser pesquisado
  mystery_min_length: 1000       # acima disso, uma sequencia desconhecida vira
                                 # candidata a virus novo
  hsp_only: "NO"           # "YES" mostra so o trecho que deu semelhanca;
                           # "NO" mostra a sequencia inteira

  kmers:
    abyss: "31"            # tamanho do pedaco usado na montagem, como no artigo
                           # de Deng et al. 2015
    soap: "31"
    metavelvet: "31"

steps:
  paired_end: false
  dedup: true
  remove_adaptor: false      # desligado tambem desliga o corte por qualidade
  merge_pairs: false         # tenta juntar as duas leituras de um mesmo fragmento
  skip_reads: false

  host_filter:
    keep_human: false        # false = joga fora o que for humano
    keep_bacteria: true      # true = mantem o que for bacteria

  assembly:
    mode: "no"               # "no" = sem montagem; "denovo" = tres montadores +
                             # consenso; "trinity" = na verdade usa o SPAdes

  viral_search:
    diamond_only: false
    nucleotide: false        # busca comparando DNA em vez de proteina
    phage: "False"           # inclui ou nao virus que infectam bacterias

  nr_filter: true
  mystery: false             # investiga as sequencias que nao se pareceram com nada
  hmmer: false               # busca por familias virais nas sequencias desconhecidas
  clark: false
  nt_route: false            # rota alternativa; as contagens que ela produz nao sao
                             # confiaveis, ver docs/known-issues.md
  reassemble: false          # tenta montar de novo usando varias amostras juntas

  input:
    from_fasta: false
    from_bam: false
    sra_prep: false

  output:
    blast_databases: true    # deixa o resultado pesquisavel no final
    copy_fastq: true         # guarda uma copia das leituras originais

tools:
  scripts_dir: "/mnt/cluster/xdeng/script/"
  blastn: "/mnt/cluster/xdeng/tools/ncbi-blast-2.2.31+/bin/blastn"
  blastx: "/mnt/cluster/xdeng/tools/ncbi-blast-2.2.31+/bin/blastx"
  dustmasker: "/mnt/cluster/xdeng/tools/ncbi-blast-2.2.31+/bin/dustmasker"
  bowtie2: "/mnt/cluster/xdeng/tools/bowtie2-2.2.4/bowtie2"
  diamond: "/mnt/cluster/xdeng/tools/diamond/diamond"
  hmmsearch: "/mnt/cluster/xdeng/tools/hmmer-3.1b2-linux-intel-x86_64/binaries/hmmsearch"
  spades_dir: "/mnt/cluster/tools/SPAdes-3.11.1-Linux/bin/"
  cap3: "/mnt/cluster/xdeng/tools/CAP3/cap3"
  soapdenovo: "/mnt/cluster/xdeng/tools/SOAPdenovo2-src-r240/SOAPdenovo-63mer"
  velvetg: "/mnt/cluster/tools/MetaVelvet-1.2.02/velvetg"
  velveth: "/mnt/cluster/tools/MetaVelvet-1.2.02/velveth"
  meta_velvetg: "/mnt/cluster/tools/MetaVelvet-1.2.02/meta-velvetg"
  abyss_pe: "/mnt/cluster/tools/abyss/bin/abyss-pe"
  samtools: "/mnt/cluster/xdeng/tools/samtools-1.2/samtools"
  picard_dir: "/mnt/cluster/xdeng/tools/picard-tools-1.136/"
  rapsearch: "/mnt/cluster/xdeng/tools/RAPSearch2.23_64bits/bin/rapsearch"
  prerapsearch: "/mnt/cluster/xdeng/tools/RAPSearch2.23_64bits/bin/prerapsearch"
  ray: "/mnt/cluster2/xdeng/tools/Ray2.3/Ray"

databases:
  virus_protein: "/mnt/cluster/xdeng/blastdb/virus_mask"
  virus_dna: "/mnt/cluster/xdeng/blastdb/virus_DNA_mask"
  phage: "/mnt/cluster/xdeng/blastdb/phage_mask"
  virus_phage: "/mnt/cluster/xdeng/blastdb/virusphage_mask"
  non_viral_nr: "/mnt/cluster/xdeng/blastdb/nvnr"
  diamond_nr: "/mnt/cluster/xdeng/blastdb/diamond.dmnd"
  diamond_virus: "/mnt/cluster/xdeng/blastdb/virusdiamond.dmnd"
  rapsearch_nr: "/mnt/cluster/xdeng/blastdb/nvrap"
  vfam_hmm: "/mnt/cluster/xdeng/blastdb/vFam/vFam-A_2014.hmm"
  vfam_annotation: "/mnt/cluster/xdeng/blastdb/vFam/annot2014.txt"
  virus_fasta: "/mnt/cluster/xdeng/blastdb/virus.fa"
  non_viral_fasta: "/mnt/cluster/xdeng/blastdb/nvrefseq.fa"
  human_bowtie_index: "/mnt/cluster/xdeng/hg38/mrnadna_bowtie"
  bacteria_bowtie_prefix: "/mnt/cluster/xdeng/nt/Bacteria"
  bacteria_index_count: 27
  nt_bowtie_prefix: "/mnt/cluster/xdeng/taxon/nt_"
