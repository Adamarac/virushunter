# Ajustes do pipeline. Os valores reproduzem o codigo original.

compute:
  threads: 48          # processadores usados por cada programa
  query_splits: 50     # pedacos em que a busca e dividida

params:
  evalue: "0.01"                 # quanto menor, mais exigente
  min_read_length: 50            # leitura menor que isso e descartada
  contig_length_pre_cap3: 300    # tamanho minimo para entrar na montagem
  contig_length_post_cap3: 1500  # tamanho minimo para ser pesquisado
  mystery_min_length: 1000       # acima disso vira candidato a virus novo
  hsp_only: "NO"                 # "YES" mostra so o trecho semelhante

  kmers:
    abyss: "31"                  # como no artigo de Deng et al. 2015
    soap: "31"
    metavelvet: "31"

steps:
  paired_end: false
  dedup: true
  remove_adaptor: false      # desligado, desliga tambem o corte por qualidade
  merge_pairs: false
  skip_reads: false

  host_filter:
    keep_human: false        # false = descarta o que for humano
    keep_bacteria: true      # true = mantem o que for bacteria

  assembly:
    mode: "no"               # "no" | "denovo" | "trinity" (usa SPAdes)

  viral_search:
    diamond_only: false
    nucleotide: false        # compara DNA em vez de proteina
    phage: "False"           # "False" | "True" | "Both"

  nr_filter: true
  nr_filter_method: "diamond"  # "diamond" e rapido; "blast" compara e-values
  mystery: false
  hmmer: false
  clark: false
  nt_route: false            # contagens nao confiaveis, ver docs/known-issues.md
  reassemble: false

  input:
    from_fasta: false
    from_bam: false
    sra_prep: false

  output:
    blast_databases: true
    copy_fastq: true

# Caminho com barra = relativo ao projeto; nome simples = procurado no PATH.
# Sem caminho = nao existe para Windows, ver tools/README.md.
tools:
  scripts_dir: "script/"
  blastn: "tools/bin/blastn.exe"
  makeblastdb: "tools/bin/makeblastdb.exe"
  blastx: "tools/bin/blastx.exe"
  dustmasker: "tools/bin/dustmasker.exe"
  bowtie2: "tools/bin/bowtie2"
  diamond: "tools/bin/diamond.exe"
  hmmsearch: "hmmsearch"
  spades_dir: ""
  cap3: "cap3"
  soapdenovo: "SOAPdenovo-63mer"
  velvetg: "velvetg"
  velveth: "velveth"
  meta_velvetg: "meta-velvetg"
  abyss_pe: "abyss-pe"
  samtools: "samtools"
  picard_dir: ""
  rapsearch: "rapsearch"
  prerapsearch: "prerapsearch"
  ray: "Ray"

# Nao vem com o projeto: baixe ou construa cada um, ver docs/databases.md.
databases:
  virus_protein: "db/virus_mask"
  virus_dna: "db/virus_DNA_mask"
  phage: "db/phage_mask"
  virus_phage: "db/virusphage_mask"
  non_viral_nr: "db/nvnr"
  diamond_nr: "db/diamond.dmnd"
  diamond_virus: "db/virusdiamond.dmnd"
  rapsearch_nr: "db/nvrap"
  vfam_hmm: "db/vFam-A_2014.hmm"
  vfam_annotation: "db/annot2014.txt"
  virus_fasta: "db/virus.fa"
  non_viral_fasta: "db/nvrefseq.fa"
  human_bowtie_index: "db/mrnadna_bowtie"
  bacteria_bowtie_prefix: "db/Bacteria"
  bacteria_index_count: 27
  nt_bowtie_prefix: "db/nt_"
  nt_index_count: 14
